name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres@localhost:5432/nexus_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        if: ${{ hashFiles('prisma/schema.prisma') != '' }}
        run: |
          if [ ! -x node_modules/.bin/prisma ]; then
            echo "Prisma schema exists but the lockfile-local Prisma CLI is missing"
            exit 1
          fi
          node_modules/.bin/prisma migrate deploy

      - name: Verify
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
